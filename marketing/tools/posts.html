<!doctype html>
<!--
  BgadAI Instagram carousel (1080x1350, 4:5). Rendered by posts.mjs: #slide=<1..8>&raw=<dir>&samples=<dir>
  Design rules: one editorial system across slides, headline ≤ 6 words, content inside a 90px safe margin.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Rock+Salt&family=Inter:wght@400;500;600;700&display=block" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #0b0b0b; background: #fff; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  .abs { position: absolute; }
  .wide { font-family: Anybody, sans-serif; font-stretch: 150%; font-weight: 800; text-transform: uppercase; line-height: 0.92; letter-spacing: -0.01em; }
  .cond { font-family: Anybody, sans-serif; font-stretch: 62%; font-weight: 750; text-transform: uppercase; line-height: 0.9; }
  .script { font-family: "Rock Salt", cursive; color: #a874ff; }
  .label { font-size: 24px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  .muted { color: #6d6d6d; }
  .sub { font-size: 32px; line-height: 1.35; color: #3d3d3d; }
  .dark { background: #0e0d10; color: #ecebef; }
  .dark .sub { color: #b7b3bd; }
  .dark .muted { color: #8f8b96; }
  .phone { position: absolute; background: #111; border-radius: 74px; box-shadow: 0 40px 80px rgb(0 0 0 / 0.22), inset 0 0 0 2px #2a2a2a; }
  .phone .screen { position: absolute; inset: 16px; border-radius: 60px; overflow: hidden; background: #fff; }
  .phone .screen img { width: 100%; display: block; }
  .phone .island { position: absolute; left: 50%; top: 30px; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 99px; }
  .card { position: absolute; background: #efefef; clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%); }
  .card img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; padding: 16px; }
  .chip { display: inline-flex; align-items: center; height: 58px; padding: 0 24px; border: 2px solid currentColor; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 12px 12px 0; }
  .chip.on { background: #0b0b0b; color: #fff; border-color: #0b0b0b; }
  .top { position: absolute; left: 90px; right: 90px; top: 70px; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: Anybody, sans-serif; font-stretch: 150%; font-weight: 800; font-size: 28px; letter-spacing: 0.06em; }
  .dark .brand { font-stretch: 62%; font-size: 34px; }
  .count { font-size: 22px; font-weight: 600; letter-spacing: 0.14em; }
  .foot { position: absolute; left: 90px; right: 90px; bottom: 60px; display: flex; justify-content: space-between; font-size: 22px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .laptop .lid { position: absolute; background: #1b1b1d; border-radius: 20px; padding: 16px; }
  .laptop .lid img { width: 100%; display: block; border-radius: 4px; }
  .laptop .base { position: absolute; background: linear-gradient(#d9d9dc, #a9a9ad); border-radius: 0 0 20px 20px; height: 28px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const N = Number(P.slide || 1), TOTAL = 8;
const raw = (n) => `file://${P.raw}/${n}.png`;
const sample = (k) => `file://${P.samples}/${k}.webp`;
const ast = (size, color = "#0b0b0b") => `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><g fill="${color}">${[0, 45, 90, 135].map((r) => `<rect x="41" y="0" width="18" height="100" rx="2" transform="rotate(${r} 50 50)"/>`).join("")}</g></svg>`;
const phone = (src, { x, y, w, rot = 0, crop = 0 }) => {
  const h = w * 2.06;
  return `<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)"><div class="screen"><img src="${src}" style="margin-top:-${crop}px"></div><div class="island"></div></div>`;
};
const card = (k, { x, y, w, rot = 0 }) => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${w * 1.3}px;transform:rotate(${rot}deg)"><img src="${sample(k)}"></div>`;
const chrome = (dark) => `<div class="top"><span class="brand">${dark ? "▮ BGADAI" : "BGADAI"}</span><span class="count ${dark ? "muted" : "muted"}">${N} / ${TOTAL}</span></div>`;

const slides = {
  1: () => ({ html: `
    ${chrome()}
    <div class="abs label muted" style="left:90px;top:190px">Meet your AI stylist</div>
    <div class="abs wide" style="left:90px;top:240px;font-size:112px">Your closet,<br>styled<br>by AI.</div>
    <div class="abs" style="left:880px;top:300px">${ast(110)}</div>
    ${phone(raw("light-m-today"), { x: 170, y: 700, w: 300, rot: -5 })}
    ${phone(raw("dark-m-today"), { x: 570, y: 660, w: 300, rot: 5 })}
    <div class="foot" style="justify-content:flex-end"><span>Swipe →</span></div>` }),
  2: () => ({ dark: true, html: `
    ${chrome(true)}
    <div class="abs cond" style="left:90px;top:230px;font-size:190px;color:#ecebef">A full<br>closet.</div>
    <div class="abs cond" style="left:90px;top:620px;font-size:190px;color:#4b4852">Nothing<br>to wear.</div>
    <div class="abs script" style="left:96px;top:1030px;font-size:54px">sound familiar?</div>
    <div class="abs sub" style="left:90px;top:1140px;width:880px">BgadAI turns the clothes you already own into outfits you'll actually wear.</div>` }),
  3: () => ({ html: `
    ${chrome()}
    <div class="abs label muted" style="left:90px;top:170px">01 · Your closet</div>
    <div class="abs wide" style="left:90px;top:220px;font-size:96px">Snap.<br>Tag. Done.</div>
    <div class="abs sub" style="left:90px;top:440px;width:420px">Photos become a tidy closet — AI tags type, colour, season and formality.</div>
    ${card("blazer-black", { x: 100, y: 760, w: 240, rot: -6 })}
    ${card("jeans-black", { x: 300, y: 860, w: 220, rot: 4 })}
    ${phone(raw("light-m-closet"), { x: 610, y: 560, w: 350, rot: 3 })}` }),
  4: () => ({ html: `
    ${chrome()}
    <div class="abs label muted" style="left:90px;top:170px">02 · Every morning</div>
    <div class="abs wide" style="left:90px;top:220px;font-size:96px">Outfits<br>for today.</div>
    <div class="abs" style="left:90px;top:460px;width:500px">
      <span class="chip on">☀ 15°C Paris</span><span class="chip">☕ Casual</span><span class="chip">🧶 Cozy</span><span class="chip">💼 Work</span>
    </div>
    <div class="abs sub" style="left:90px;top:660px;width:440px">Weather, occasion and mood in. Three outfits out — each with a reason.</div>
    ${phone(raw("light-m-today-full"), { x: 610, y: 560, w: 350, rot: 3, crop: 860 })}` }),
  5: () => ({ html: `
    ${chrome()}
    <div class="abs label muted" style="left:90px;top:170px">03 · Trips</div>
    <div class="abs wide" style="left:90px;top:220px;font-size:110px">Pack<br>light.</div>
    <div class="abs wide" style="left:90px;top:530px;font-size:118px;line-height:1">10</div>
    <div class="abs label" style="left:96px;top:660px">pieces</div>
    <div class="abs wide" style="left:418px;top:530px;font-size:118px;line-height:1">5</div>
    <div class="abs label" style="left:424px;top:660px">outfits</div>
    <div class="abs wide" style="left:340px;top:560px;font-size:56px;line-height:1">→</div>
    <div class="abs sub" style="left:90px;top:780px;width:440px">A plan for every day of your trip and a packing checklist — forecast included.</div>
    ${phone(raw("light-m-trip"), { x: 610, y: 560, w: 350, rot: 3 })}` }),
  6: () => ({ html: `
    ${chrome()}
    <div class="abs label muted" style="left:90px;top:170px">04 · Before you buy</div>
    <div class="abs wide" style="left:90px;top:220px;font-size:96px">Buy less.<br>Wear more.</div>
    <div class="abs" style="left:90px;top:470px;background:#0b0b0b;color:#fff;padding:26px 30px">
      <div class="wide" style="font-size:64px">+34</div><div class="label" style="margin-top:8px">outfits unlocked</div>
    </div>
    <div class="abs sub" style="left:90px;top:690px;width:440px">See how a new piece works with your closet — and spot duplicates — before you pay.</div>
    ${phone(raw("light-m-smartbuys"), { x: 610, y: 560, w: 350, rot: 3 })}` }),
  7: () => ({ dark: true, html: `
    ${chrome(true)}
    <div class="abs label muted" style="left:90px;top:170px">05 · Habits</div>
    <div class="abs cond" style="left:90px;top:220px;font-size:170px;color:#ecebef">Your style,<br>wrapped.</div>
    <div class="abs script" style="left:96px;top:600px;font-size:44px;width:470px;line-height:1.5">streaks, badges<br>& #30wears</div>
    <div class="abs sub" style="left:90px;top:780px;width:460px">Track what you actually wear and share your year in outfits.</div>
    ${phone(raw("dark-m-wrapped"), { x: 610, y: 600, w: 340, rot: 3 })}` }),
  8: () => ({ html: `
    ${chrome()}
    <div class="abs wide" style="left:90px;top:190px;font-size:120px">Try it<br>free.</div>
    <div class="abs" style="left:90px;top:470px;width:900px">
      <span class="chip on">Free</span><span class="chip">Private · on-device</span><span class="chip">Works offline</span><span class="chip">Phone & desktop</span>
    </div>
    <div class="laptop">
      <div class="lid" style="left:90px;top:700px;width:760px"><img src="${raw("light-d-closet")}"></div>
      <div class="base" style="left:60px;top:1186px;width:820px"></div>
    </div>
    ${phone(raw("light-m-plan"), { x: 770, y: 760, w: 210, rot: 5 })}
    <div class="foot"><span>github.com/S2K7x/BgadAI</span><span>Link in bio</span></div>` }),
};

const s = slides[N]();
const root = document.getElementById("root");
root.innerHTML = `<div class="slide ${s.dark ? "dark" : ""}">${s.html}</div>`;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
</script>
</body>
</html>
